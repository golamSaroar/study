<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study page</title>
<script src="lab7-config.js"></script>
<style>
  :root {
    --ink:#18191b; --ink-2:#3d4046; --muted:#6c707a; --line:#e7e4df; --line-2:#d6d2cb;
    --bg:#f6f5f2; --paper:#fff; --accent:#245c4c; --accent-soft:#e3eee9; --bad:#a1281b; --bad-soft:#f7e4e1; --rec:#d4402f;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: "Charter", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16.5px/1.6 var(--sans); color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:18px; height:60px; padding:0 32px; background:var(--bg); border-bottom:1px solid var(--line); }
  header .title { font:600 18px/1 var(--serif); }
  header .spacer { flex:1; }
  header .clock { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  header .clock.low { color:var(--bad); }
  header .pill { font-size:13px; color:var(--muted); background:var(--paper); border:1px solid var(--line-2); border-radius:999px; padding:3px 11px; }
  .progress { height:4px; background:var(--line); }
  .progress div { height:4px; background:var(--accent); transition:width .3s; }
  main { max-width:860px; margin:36px auto 120px; padding:0 24px; }
  main.wide { max-width:1320px; }
  .cols { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:20px; align-items:start; }
  .cols > div { min-width:0; }
  .sticky { position:sticky; top:84px; }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:28px 32px; margin-bottom:20px; }
  h1 { font:600 28px/1.2 var(--serif); margin:0 0 14px; }
  h2 { font:600 12px/1 var(--sans); text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:0 0 16px; }
  p { margin:0 0 12px; }
  .muted { color:var(--muted); font-size:14.5px; }
  .q { font-weight:600; margin:0 0 10px; }
  .goal { margin:0 0 22px; padding:2px 0 2px 18px; border-left:2px solid var(--accent); color:var(--ink-2); font-size:17px; }
  .goal::before { content:"Goal"; display:block; font:600 11.5px/1 var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--accent); margin-bottom:7px; }
  .banner { margin:0 0 22px; }
  .banner .eyebrow { font:600 12px/1 var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-bottom:9px; }
  .banner .lead { font:400 26px/1.25 var(--serif); }
  .banner.stop .eyebrow { color:var(--bad); }
  .step { display:grid; grid-template-columns:26px 1fr; gap:10px; padding:12px 0; border-top:1px solid var(--line); }
  h1 + .step, h2 + .step { border-top:0; padding-top:2px; }
  .num { font:600 13px/1.75 var(--mono); color:var(--muted); }
  button, .btn { display:inline-flex; align-items:center; gap:8px; background:var(--ink); color:#fff; border:1px solid var(--ink); border-radius:9px; padding:11px 20px; font:600 15px/1.2 var(--sans); cursor:pointer; text-decoration:none; }
  button:hover, .btn:hover { background:#000; }
  button.secondary, .btn.secondary { background:var(--paper); color:var(--ink); border-color:var(--line-2); }
  button.secondary:hover, .btn.secondary:hover { border-color:var(--ink); }
  button:disabled { opacity:.45; cursor:default; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  label.f { display:block; font-weight:600; font-size:14.5px; margin:20px 0 8px; }
  input[type=text], input[type=number] { font:500 17px var(--sans); padding:10px 13px; border:1px solid var(--line-2); border-radius:9px; width:320px; max-width:100%; background:var(--paper); color:var(--ink); }
  input:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .choices { display:flex; gap:8px; flex-wrap:wrap; }
  .choices.col { flex-direction:column; align-items:flex-start; }
  .choices label { display:flex; align-items:center; gap:9px; font-size:15.5px; border:1px solid var(--line-2); border-radius:9px; padding:9px 15px; cursor:pointer; background:var(--paper); }
  .choices label:has(input:checked) { border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }
  .choices input { accent-color:var(--ink); margin:0; }
  .choices code { font-size:14px; }
  .error { color:var(--bad); font-weight:500; font-size:14.5px; margin-top:14px; }
  pre { background:#f7f6f2; border:1px solid var(--line); border-radius:10px; padding:14px 16px; font:13.5px/1.55 var(--mono); overflow:auto; margin:10px 0 14px; }
  code { font-family:var(--mono); font-size:.9em; background:#efeee9; padding:1px 5px; border-radius:5px; }
  pre code { background:none; padding:0; font-size:inherit; }
  table { border-collapse:collapse; width:100%; margin:10px 0 16px; font-size:14.5px; }
  th { text-align:left; font-weight:600; color:var(--ink-2); background:#f5f4f0; }
  th, td { border-bottom:1px solid var(--line); padding:7px 10px; vertical-align:top; }
  .note h1 { font-size:24px; } .note h2, .task h2 { font:600 18px/1.3 var(--serif); text-transform:none; letter-spacing:0; color:var(--ink); margin:24px 0 8px; }
  .note ul, .note ol, .task ul { padding-left:22px; } .note li, .task li { margin:3px 0; }
  .item { padding:18px 0; border-top:1px solid var(--line); }
  .item:first-of-type { border-top:0; padding-top:0; }
  textarea.code { width:100%; min-height:440px; font:14px/1.55 var(--mono); padding:14px 16px; border:1px solid var(--line-2); border-radius:10px; background:#fbfaf7; color:var(--ink); tab-size:4; resize:vertical; white-space:pre; overflow:auto; }
  textarea.code[readonly] { background:#f3f2ee; color:var(--ink-2); }
  .results { margin-top:14px; font-size:14px; }
  .results .r { display:grid; grid-template-columns:22px 1fr; gap:6px; padding:6px 0; border-top:1px solid var(--line); }
  .results .ok { color:var(--accent); font-weight:700; } .results .no { color:var(--bad); font-weight:700; }
  .results .err { background:var(--bad-soft); color:var(--bad); padding:10px 12px; border-radius:8px; font:13px/1.5 var(--mono); white-space:pre-wrap; }
  .chat { display:flex; flex-direction:column; gap:18px; max-height:62vh; overflow:auto; padding-right:4px; }
  .msg { font-size:15px; overflow-wrap:anywhere; }
  .msg p { margin:0 0 10px; } .msg p:last-child { margin-bottom:0; }
  .me { align-self:flex-end; max-width:85%; background:#ecebe6; padding:10px 15px; border-radius:16px 16px 4px 16px; white-space:pre-wrap; }
  .ai ol, .ai ul { padding-left:22px; margin:6px 0 10px; }
  .composer { display:flex; gap:10px; align-items:flex-end; margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
  .composer textarea { flex:1; min-height:50px; max-height:200px; resize:vertical; font:15px/1.5 var(--sans); padding:11px 13px; border:1px solid var(--line-2); border-radius:12px; background:var(--paper); color:var(--ink); }
  .thinking { color:var(--muted); font-size:14.5px; }
  .prompt { font:400 19px/1.5 var(--serif); border-left:2px solid var(--accent); padding:4px 0 4px 20px; margin:18px 0 22px; }
  .record { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:22px; padding:18px 20px; border:1px solid var(--line); border-radius:12px; background:#fbfaf8; }
  .dot { width:14px; height:14px; border-radius:50%; background:#c9c6bf; }
  .dot.on { background:var(--rec); box-shadow:0 0 0 5px rgba(212,64,47,.15); }
  .big { font-size:32px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; }
  .pilebox { display:inline-block; font:700 20px/1 var(--sans); padding:12px 18px; border:2px solid var(--ink); border-radius:10px; margin:6px 0 10px; }
  .warn { background:var(--bad-soft); border:1px solid #ecc7c1; color:#5c1a12; border-radius:12px; padding:14px 18px; margin-bottom:20px; font-size:15px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:20px; }
  .saved { color:var(--accent); font-weight:600; font-size:13.5px; }
  .pv { background:#fff8e1; border-bottom:1px solid #ecd9a0; padding:10px 32px; font-size:14px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .pv strong { font-weight:600; }
  .pv a, .pv button.link { color:var(--ink); font:600 14px var(--sans); background:none; border:0; padding:0; text-decoration:underline; cursor:pointer; }
  .pv .on { text-decoration:none; background:var(--ink); color:#fff; border-radius:6px; padding:2px 8px; }
  @media (max-width:980px) { .cols { grid-template-columns:1fr; } .sticky { position:static; } }
  @media (max-width:640px) { header { padding:0 16px; } main { padding:0 14px; } .card { padding:22px 20px; } }
</style>
</head>
<body>
<header>
  <span class="title" id="title">Study page</span>
  <span class="spacer"></span>
  <span class="clock" id="clock"></span>
  <span class="pill" id="who" hidden></span>
</header>
<div class="progress"><div id="bar" style="width:0"></div></div>
<div class="pv" id="pv" hidden></div>
<main id="app"></main>

<script>
const CFG = window.STUDY_CONFIG;
const QS = new URLSearchParams(location.search);
const PREVIEW = QS.has("preview");
const MOCK = QS.has("mock") || PREVIEW;
const FAST = MOCK && QS.has("fast");
const quick = () => FAST || S.studyId === "0000";
const STORE = "study:" + CFG.session + (PREVIEW ? ":preview" : MOCK ? ":mock" : "");
const PG = ["A", "B", "C"].includes(QS.get("g")) ? QS.get("g") : "B";
const LEARN_MS = () => quick() ? 40000 : CFG.minutes.learn * 60000;
const FOLLOW_MS = () => quick() ? 15000 : CFG.minutes.followUp * 60000;
const ORDER = ["intro", "id", "consent", "warmup", "ready", "learn", "follow", "jol", "submit", "done"];
const FN = "getMaxDistanceToLeaf";
const STARTER = `function getMaxDistanceToLeaf(person, contactGraph, visited = new Set()) {
  // your code here
}
`;
const GRAPHS = {
  contactGraph: {
    "Ava": ["Ben", "Cara"],
    "Ben": ["Dev"],
    "Cara": ["Dev", "Eli"],
    "Dev": ["Fay"],
    "Eli": [],
    "Gus": ["Hana"],
    "Hana": ["Ivan"],
    "Ivan": ["Gus"],
    "Jo": ["Gus", "Kai"],
    "Kai": ["Lee"]
  }
};
const CASES = [
  { person: "Fay", graph: "contactGraph", want: 0 },
  { person: "Eli", graph: "contactGraph", want: 0 },
  { person: "Dev", graph: "contactGraph", want: 1 },
  { person: "Ben", graph: "contactGraph", want: 2 },
  { person: "Ava", graph: "contactGraph", want: 3 },
  { person: "Gus", graph: "contactGraph", want: "-Infinity" }
];
const TASK = `**Write a recursive function \`getMaxDistanceToLeaf(person, contactGraph, visited)\`.**

This is the last function in Lab 7's programming task. You don't need the other functions: a contact graph is given below.

A **contact graph** is an object. Each key is a sick person's name, and its value is an array of the people they had contact with. A **leaf** is someone with no contacts listed: either they aren't a key in the graph, or their array is empty.

The function returns the number of steps in the **longest** chain of contacts that starts at \`person\` and ends at a leaf.

\`\`\`
const contactGraph = {
  "Ava": ["Ben", "Cara"],
  "Ben": ["Dev"],
  "Cara": ["Dev", "Eli"],
  "Dev": ["Fay"],
  "Eli": [],
  "Gus": ["Hana"],
  "Hana": ["Ivan"],
  "Ivan": ["Gus"],
  "Jo": ["Gus", "Kai"],
  "Kai": ["Lee"]
};
\`\`\`

| Call | Returns | Why |
|---|---|---|
| \`getMaxDistanceToLeaf("Fay", contactGraph)\` | \`0\` | Fay isn't a key, so Fay is a leaf |
| \`getMaxDistanceToLeaf("Eli", contactGraph)\` | \`0\` | Eli's array is empty, so Eli is a leaf |
| \`getMaxDistanceToLeaf("Ben", contactGraph)\` | \`2\` | Ben → Dev → Fay |
| \`getMaxDistanceToLeaf("Ava", contactGraph)\` | \`3\` | Ava → Cara → Dev → Fay (Ava → Cara → Eli is shorter) |
| \`getMaxDistanceToLeaf("Gus", contactGraph)\` | \`-Infinity\` | Gus → Hana → Ivan → Gus … goes round in a cycle |

**Requirements**

- The function must be **recursive**: call it on each of the person's contacts, take the largest result, and add 1.
- \`visited\` is a \`Set\` of the people on the **current path**. It starts empty (\`visited = new Set()\`), so callers can leave it out.
- If \`person\` is already in \`visited\`, the path has gone round a cycle: return \`-Infinity\`.
- Only the current path counts. Once you have finished with a person's contacts, take them out of \`visited\` again, so that a different path can pass through the same person.
- Don't change \`contactGraph\`.`;

const WARMUP = [
  { id: "w1", q: `<pre style="margin:0 0 6px">function f(n) {\n  if (n <= 0) return 0;\n  return n + f(n - 1);\n}</pre>What does <code>f(3)</code> return?`, opts: ["6", "3", "0", "It never stops"], key: 0, html: true },
  { id: "w2", q: `In a recursive function, what is the base case for?`, opts: ["It stops the recursion", "It makes the function faster", "It handles errors", "It stores the results"], key: 0 },
  { id: "w3", q: `<code>const s = new Set(); s.add("a"); s.add("a");</code> What is <code>s.size</code>?`, opts: ["1", "2", "0", "It throws an error"], key: 0, html: true },
  { id: "w4", q: `<code>const g = { a: ["b"] };</code> What is <code>g["z"]</code>?`, opts: ["undefined", "[]", "null", "It throws an error"], key: 0, html: true },
  { id: "w5", q: `What is <code>Math.max()</code> with no arguments?`, opts: ["-Infinity", "0", "undefined", "NaN"], key: 0, html: true }
];
const BACKGROUND = [
  { id: "courses", q: "Approximately how many programming courses have you completed before this one?", opts: ["0", "1", "2", "3", "4 or more"] },
  { id: "familiar", q: "How familiar are you with the topic of today's activity (recursion)?", opts: ["Not at all", "Slightly", "Moderately", "Very", "Extremely"] },
  { id: "ai_freq", q: "How often do you use generative AI tools (e.g., ChatGPT, Copilot) for coursework?", opts: ["Never", "A few times a term", "A few times a month", "Weekly", "Daily"] },
  { id: "ai_use", q: "When you use AI for coursework, what do you mainly use it for? (choose all that apply)", opts: ["Getting explanations", "Generating code or answers", "Debugging", "Checking my own work", "Other", "I don't use AI"], multi: true },
  { id: "seen_task", q: "Before today, had you already worked on getMaxDistanceToLeaf in Lab 7?", opts: ["No", "Looked at it only", "Started it", "Finished it"] }
];
const ROT = { w1: [1, 3, 0, 2], w2: [2, 0, 3, 1], w3: [3, 1, 0, 2], w4: [1, 0, 2, 3], w5: [2, 3, 1, 0] };

let S = load();
let key = null, busy = false;
let recorder = null, recording = null, recStartedAt = null;

document.getElementById("title").textContent = CFG.title;
document.title = CFG.title;

function fresh() { return { phase: "intro", log: {}, code: STARTER, transcript: [], records: [] }; }
function load() { try { return JSON.parse(localStorage.getItem(STORE)) || fresh(); } catch { return fresh(); } }
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch {} }
function setPhase(p) { S.phase = p; S.log[p] = S.log[p] || newLog(); save(); render(); }
function newLog() { return { start: Date.now(), firstEdit: null, edits: 0, pastes: 0, pasteChars: 0, hidden: 0, hiddenMs: 0, blur: 0 }; }
function L() { return S.log[S.phase] || (S.log[S.phase] = newLog()); }

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function inline(s) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
}
function md(src) {
  const lines = esc(src).split("\n"); const out = []; let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push("<pre><code>" + buf.join("\n") + "</code></pre>"); }
    else if (/^#{1,4} /.test(line)) { const lv = Math.min(line.match(/^#+/)[0].length, 3); out.push(`<h${lv}>${inline(line.replace(/^#+ /, ""))}</h${lv}>`); i++; }
    else if (/^\|/.test(line)) {
      const rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => inline(c.trim().replace(/\\\|/g, "|")));
      const body = rows.filter((r, k) => k !== 1 || !/^\|[\s\-:|]+\|$/.test(r));
      out.push("<table>" + body.map((r, k) => "<tr>" + cells(r).map(c => k === 0 ? `<th>${c}</th>` : `<td>${c}</td>`).join("") + "</tr>").join("") + "</table>");
    }
    else if (/^\s*[-*] /.test(line)) { const it = []; while (i < lines.length && /^\s*[-*] /.test(lines[i])) it.push(lines[i++].replace(/^\s*[-*] /, "")); out.push("<ul>" + it.map(t => `<li>${inline(t)}</li>`).join("") + "</ul>"); }
    else if (/^\s*\d+\. /.test(line)) { const it = []; while (i < lines.length && /^\s*\d+\. /.test(lines[i])) it.push(lines[i++].replace(/^\s*\d+\. /, "")); out.push("<ol>" + it.map(t => `<li>${inline(t)}</li>`).join("") + "</ol>"); }
    else if (line.trim() === "") i++;
    else { const buf = []; while (i < lines.length && lines[i].trim() !== "" && !/^(```|#{1,4} |\||\s*[-*] |\s*\d+\. )/.test(lines[i])) buf.push(lines[i++]); out.push("<p>" + inline(buf.join(" ")) + "</p>"); }
  }
  return out.join("\n");
}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlockKey(code) {
  if (MOCK) return "mock";
  const e = CFG.encryptedKey;
  if (!e) throw new Error("not set up");
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
  const aes = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(e.salt), iterations: e.iterations, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(e.iv) }, aes, b64(e.ct)));
}
async function askAssistant() {
  if (MOCK) { await new Promise(r => setTimeout(r, 600)); return PREVIEW ? "**Preview reply.** In the real session this is a live AI assistant, and students can ask it anything.\n\nStart with the base case: what should the function return for someone who has no contacts listed?" : "**Mock reply.** Start with the base case."; }
  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
    body: JSON.stringify({
      model: CFG.model,
      messages: [{ role: "system", content: CFG.systemPrompt }, ...S.transcript],
      ...(CFG.reasoningEffort ? { reasoning_effort: CFG.reasoningEffort } : {}),
      store: true,
      metadata: { study_id: S.studyId, group: S.group, session: CFG.session }
    })
  });
  if (!res.ok) { let d = ""; try { d = (await res.json()).error.message; } catch {} throw new Error(d || ("HTTP " + res.status)); }
  return (await res.json()).choices[0].message.content;
}

const JS_WORKER = `
const show = v => v === -Infinity ? "-Infinity" : v === Infinity ? "Infinity" : v === undefined ? "undefined" : JSON.stringify(v);
onmessage = e => {
  const { code, cases, graphs } = e.data;
  let fn;
  const src = code.replace(/^\\s*export\\s+(default\\s+)?/gm, "");
  try { new Function(src); } catch (err) { postMessage({ error: err.name + ": " + err.message }); return; }
  try { fn = new Function(src + "\\n;return typeof ${FN} === 'function' ? ${FN} : null;")(); }
  catch (err) { postMessage({ error: err.name + ": " + err.message }); return; }
  if (!fn) { postMessage({ error: "No function named ${FN} was found." }); return; }
  const results = cases.map(c => {
    const g = structuredClone(graphs[c.graph]), before = JSON.stringify(g);
    const want = c.want === "-Infinity" ? -Infinity : c.want;
    let got, ok = false;
    try {
      const r = fn(c.person, g);
      got = show(r);
      const same = JSON.stringify(g) === before;
      ok = Object.is(r, want) && same;
      if (!same) got += " (and contactGraph was changed)";
    } catch (err) {
      got = err instanceof RangeError ? "RangeError: too much recursion. Does every path reach a base case?" : err.name + ": " + err.message;
    }
    return { person: c.person, graph: c.graph, want: c.want, got, ok };
  });
  postMessage({ results });
};`;
let worker = null;
function runTests(code) {
  return new Promise(resolve => {
    if (!worker) worker = new Worker(URL.createObjectURL(new Blob([JS_WORKER], { type: "text/javascript" })));
    const w = worker;
    const timer = setTimeout(() => { w.terminate(); worker = null; resolve({ error: "Your code took too long to finish. Is there a loop that never ends?" }); }, 4000);
    w.onmessage = e => { clearTimeout(timer); resolve(e.data); };
    w.onerror = e => { clearTimeout(timer); e.preventDefault(); w.terminate(); worker = null; resolve({ error: e.message || "Your code couldn't run." }); };
    w.postMessage({ code, cases: CASES, graphs: GRAPHS });
  });
}

function remaining(start, ms) { return Math.max(0, start + ms - Date.now()); }
function fmt(ms) { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

function tick() {
  const clock = document.getElementById("clock");
  clock.classList.remove("low");
  if (S.phase === "learn" && S.learnStart) {
    const left = remaining(S.learnStart, LEARN_MS());
    clock.textContent = fmt(left); clock.classList.toggle("low", left < 60000);
    if (left === 0) endLearn(true);
  } else if (S.phase === "follow" && S.followStart) {
    const left = remaining(S.followStart, FOLLOW_MS());
    clock.textContent = fmt(left);
    const r = document.getElementById("rec-time");
    if (r && recStartedAt) r.textContent = fmt(Date.now() - recStartedAt);
    if (left === 0) { stopRecording(); setPhase("jol"); }
  } else clock.textContent = "";
}

const VIEWS = { intro: renderIntro, id: renderId, consent: renderConsent, warmup: renderWarmup, ready: renderReady, learn: renderLearn, follow: renderFollow, jol: renderJol, submit: renderSubmit, done: renderDone };
async function render(err) {
  const app = document.getElementById("app");

  bar(); wire();
  const note = document.getElementById("note");
  if (note) note.innerHTML = await loadNote();

  if (chat) chat.scrollTop = chat.scrollHeight;

function endLearn(timedOut) {
  if (S.phase !== "learn") return;
  const box = document.getElementById("code");
  if (box) S.code = box.value;
  S.finalCode = S.code;
  S.learnEndedBy = timedOut ? "timer" : "student";
  S.learnSecs = Math.round((Date.now() - S.learnStart) / 1000);
  S.followStart = (S.group === "C" && S.audio === "yes") ? null : Date.now();
  setPhase("follow");
  runTests(S.finalCode).then(r => { S.finalTests = r.error ? { error: r.error } : { passed: r.results.filter(x => x.ok).length, of: r.results.length }; save(); });
}

function wire() {
  const $ = id => document.getElementById(id);
  const pick = n => { const el = document.querySelector(`input[name="${n}"]:checked`); return el ? el.value : null; };

  if ($("intro-go")) $("intro-go").onclick = () => {
    const a = pick("aud");
    if (!a) return render("Choose Yes or No.");
    S.audio = a; setPhase("id");
  };
  if ($("id-back")) $("id-back").onclick = () => setPhase("intro");
  if ($("id-go")) $("id-go").onclick = () => {
    const sid = $("sid").value.replace(/\D/g, "");
    const c = CFG.cards[sid];
    if (!sid) return render("Type the study ID from your card.");
    if (PREVIEW) { Object.assign(S, { studyId: sid, group: PG }); return setPhase("consent"); }
    if (!c && sid !== "0000") return render(`${sid} isn't a study ID for this lab. Check the number on your card. If it's right, raise your hand.`);
    const [group, pile] = c || [PG, S.audio];
    if (pile !== S.audio) return render(`That card is from the "Audio: ${pile.toUpperCase()}" pile, but you answered ${S.audio === "yes" ? "Yes" : "No"} to audio recording. Put it back and take the top card from the "Audio: ${S.audio.toUpperCase()}" pile.`);
    Object.assign(S, { studyId: sid, group }); setPhase("consent");
  };
  if ($("pv-next")) $("pv-next").onclick = skip;
  if ($("consent-go")) $("consent-go").onclick = () => {
    const v = $("ccode").value.trim().toLowerCase();
    if (!v) return render("Type the code word from the form's last screen.");
    if (!MOCK && v !== String(CFG.forms.consent.code).toLowerCase()) return render("That's not the code word. Make sure you pressed Submit in the consent form, then copy the word it shows.");
    S.consentAt = new Date().toISOString(); setPhase("warmup");
  };
  if (S.phase === "warmup") {
    document.querySelectorAll("input").forEach(el => el.onchange = () => { S.warmupDraft = collectWarm(); save(); });
  }
  if ($("warm-go")) $("warm-go").onclick = () => {
    const w = collectWarm();
    const missing = [...WARMUP, ...BACKGROUND].filter(it => it.multi ? !(w[it.id] || []).length : w[it.id] == null);
    if (missing.length) { S.warmupDraft = w; return render("Answer every question (" + missing.length + " left). For question 9, tick at least one box."); }
    S.warmup = Object.fromEntries(WARMUP.map(it => [it.id, { choice: it.opts[w[it.id]], correct: Number(w[it.id]) === it.key }]));
    S.warmup.score = WARMUP.filter(it => Number(w[it.id]) === it.key).length;
    S.warmup.secs = Math.round((Date.now() - L().start) / 1000);
    S.background = Object.fromEntries(BACKGROUND.map(it => [it.id, it.multi ? w[it.id].map(i => it.opts[i]) : it.opts[w[it.id]]]));
    setPhase("ready");
  };
  if ($("start")) $("start").onclick = async () => {
    if (S.group !== "A" && !key) {
      try { key = await unlockKey($("scode").value); }
      catch (e) { return render(e.message === "not set up" ? "The study assistant isn't set up yet. Raise your hand." : "That session code didn't work. Check the screen and try again."); }
    }
    S.learnStart = Date.now(); setPhase("learn");
  };
  if ($("unlock2")) $("unlock2").onclick = async () => {
    try { key = await unlockKey($("code2").value); render(); } catch { $("unlock-err").textContent = "That code didn't work."; }
  };

  const box = $("code");
  if (box && !box.readOnly) {
    let savedTimer = null;
    box.addEventListener("keydown", e => {
      if (e.key === "Tab") { e.preventDefault(); const s = box.selectionStart, en = box.selectionEnd; box.setRangeText("    ", s, en, "end"); box.dispatchEvent(new Event("input")); }
    });
    box.addEventListener("input", () => {
      const l = L(); if (l.firstEdit == null) l.firstEdit = Math.round((Date.now() - S.learnStart) / 1000); l.edits++;
      S.code = box.value; clearTimeout(savedTimer);
      savedTimer = setTimeout(() => { save(); const s = $("saved"); if (s) s.textContent = "Saved"; }, 600);
    });
    box.addEventListener("paste", e => { const t = (e.clipboardData || window.clipboardData).getData("text") || ""; const l = L(); l.pastes++; l.pasteChars += t.length; save(); });
  }
  if ($("run")) $("run").onclick = async () => {
    S.code = $("code").value; save();
    $("run").disabled = true; lastResult = { running: true }; $("results").innerHTML = resultsHtml(lastResult);
    const r = await runTests(S.code);
    lastResult = r;
    (S.runs = S.runs || []).push({ t: Math.round((Date.now() - S.learnStart) / 1000), passed: r.error ? null : r.results.filter(x => x.ok).length, error: r.error ? r.error.slice(0, 80) : undefined });
    save();
    if (S.phase === "learn" && $("results")) { $("results").innerHTML = resultsHtml(r); $("run").disabled = false; }
  };

  if ($("send")) {
    const mbox = $("msg");
    const send = async () => {
      const text = mbox.value.trim();
      if (!text || busy || S.phase !== "learn") return;
      busy = true; mbox.value = "";
      S.transcript.push({ role: "user", content: text }); save();
      const chat = $("chat");
      chat.innerHTML = transcriptHtml() + `<div class="thinking">The assistant is thinking…</div>`; chat.scrollTop = chat.scrollHeight;
      $("send").disabled = true;
      try { S.transcript.push({ role: "assistant", content: await askAssistant() }); }
      catch (e) { S.transcript.pop(); mbox.value = text; alert("The assistant didn't respond (" + e.message + "). Try again."); }
      busy = false; save();
      if (S.phase === "learn" && $("chat")) { $("chat").innerHTML = transcriptHtml(); $("chat").scrollTop = $("chat").scrollHeight; $("send").disabled = false; mbox.focus(); }
    };
    $("send").onclick = send;
    mbox.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
  }

  const choose = mode => { S.recMode = mode; S.followStart = Date.now(); save(); render(); };
  if ($("mode-phone")) $("mode-phone").onclick = () => choose("phone");
  if ($("mode-laptop")) $("mode-laptop").onclick = () => choose("laptop");
  if ($("rec-start")) $("rec-start").onclick = startRecording;
  if ($("rec-stop")) $("rec-stop").onclick = stopRecording;

  if ($("jol-go")) $("jol-go").onclick = () => {
    const v = $("jol").value.trim();
    const n = Number(v);
    if (v === "" || !Number.isFinite(n) || n < 0 || n > 100) return render("Enter a number from 0 to 100.");
    if (recording && !confirm("Did you upload your recording with the upload form?")) return;
    S.jol = Math.round(n); S.followSecs = S.followStart ? Math.round((Date.now() - S.followStart) / 1000) : null;
    keepRecord(); setPhase("submit");
  };
  if ($("submit-go")) $("submit-go").onclick = () => {
    const v = $("acode").value.trim().toLowerCase();
    if (!MOCK && v !== String(CFG.forms.answers.code).toLowerCase()) return render("That's not the code word. Make sure you pressed Submit in the form, then copy the word it shows.");
    S.submittedAt = new Date().toISOString(); setPhase("done");
  };
  if ($("copy")) $("copy").onclick = () => copyText($("packed").value, $("copy"));
  if ($("copy-code")) $("copy-code").onclick = () => copyText(S.finalCode || S.code, $("copy-code"));
}

function collectWarm() {
  const w = {};
  for (const it of [...WARMUP, ...BACKGROUND]) {
    if (it.multi) w[it.id] = [...document.querySelectorAll(`input[name="${it.id}"]:checked`)].map(e => Number(e.value));
    else { const el = document.querySelector(`input[name="${it.id}"]:checked`); w[it.id] = el ? Number(el.value) : null; }
  }
  return w;
}
async function copyText(t, btn) {
  try { await navigator.clipboard.writeText(t); } catch { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  btn.textContent = "Copied";
}
function keepRecord() { S.records = [packed()]; save(); }

function encodeWav(bufs, inRate, outRate) {
  const len = bufs.reduce((n, b) => n + b.length, 0);
  const ratio = inRate / outRate, outLen = Math.floor(len / ratio);
  const pcm = new Float32Array(len);
  let o = 0; for (const b of bufs) { pcm.set(b, o); o += b.length; }
  const v = new DataView(new ArrayBuffer(44 + outLen * 2));
  const str = (p, s) => { for (let i = 0; i < s.length; i++) v.setUint8(p + i, s.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + outLen * 2, true); str(8, "WAVE"); str(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, outRate, true); v.setUint32(28, outRate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, outLen * 2, true);
  for (let i = 0; i < outLen; i++) {
    const a = Math.floor(i * ratio), b = Math.max(a + 1, Math.floor((i + 1) * ratio));
    let s = 0; for (let j = a; j < b && j < len; j++) s += pcm[j];
    s = Math.max(-1, Math.min(1, s / (b - a)));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([v], { type: "audio/wav" });
}
function makeRecorder(stream, onDone) {
  const finish = (blob, ext) => { stream.getTracks().forEach(t => t.stop()); onDone(blob, ext); };
  const mime = ["audio/mp4;codecs=mp4a.40.2", "audio/mp4"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (mime) {
    const mr = new MediaRecorder(stream, { mimeType: mime }), parts = [];
    mr.ondataavailable = e => { if (e.data.size) parts.push(e.data); };
    mr.onstop = () => finish(new Blob(parts, { type: mr.mimeType || mime }), "m4a");
    mr.start(1000);
    return { stop: () => { if (mr.state !== "inactive") mr.stop(); } };
  }
  // Forms rejects webm/ogg, so record raw audio and save it as WAV.
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  const src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(4096, 1, 1), bufs = [];
  proc.onaudioprocess = e => bufs.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(proc); proc.connect(ctx.destination);
  let done = false;
  return { stop: () => {
    if (done) return; done = true;
    proc.disconnect(); src.disconnect();
    const rate = ctx.sampleRate; ctx.close();
    finish(encodeWav(bufs, rate, 16000), "wav");
  } };
}

async function startRecording() {
  const status = document.getElementById("rec-status");
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { status.textContent = "The microphone didn't start. Explain it out loud anyway, and tell the researcher afterwards."; return; }
  recorder = makeRecorder(stream, (blob, ext) => {
    recording = { url: URL.createObjectURL(blob), name: `${S.studyId}-explanation.${ext}` };
    recStartedAt = null;
    const s = document.getElementById("rec-status"); if (s) s.textContent = "Saved. You'll upload it in the next step.";
    const dot = document.getElementById("dot"); if (dot) dot.classList.remove("on");
    const b = document.getElementById("rec-stop"); if (b) b.disabled = true;
    if (S.phase === "jol") render();
  });
  recStartedAt = Date.now();
  status.textContent = "Recording…";
  document.getElementById("dot").classList.add("on");
  document.getElementById("rec-start").disabled = true;
  document.getElementById("rec-stop").disabled = false;
}
function stopRecording() { if (recorder) recorder.stop(); }

document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "b" && S.studyId) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([packed() + "\n\n" + (S.finalCode || S.code) + "\n\n" + JSON.stringify(S.transcript)], { type: "text/plain" }));
    a.download = `lab7-backup-${S.studyId}.txt`; a.click();
  }
});

function previewUrl(g) { return location.pathname + "?preview=1&g=" + g + "&reset=1"; }
function skip() {
  const p = S.phase;
  if (p === "intro") { S.audio = S.audio || "yes"; return setPhase("id"); }
  if (p === "id") { Object.assign(S, { studyId: S.studyId || "1234", group: PG }); return setPhase("consent"); }
  if (p === "warmup") { S.warmup = S.warmup || { score: null }; S.background = S.background || {}; return setPhase("ready"); }
  if (p === "ready") { S.learnStart = Date.now(); return setPhase("learn"); }
  if (p === "learn") return endLearn(false);
  if (p === "follow") { stopRecording(); return setPhase("jol"); }
  if (p === "jol") { S.jol = S.jol ?? 50; return setPhase("submit"); }
  const i = ORDER.indexOf(p); if (i < ORDER.length - 1) setPhase(ORDER[i + 1]);
}
function previewBar() {
  const pv = document.getElementById("pv");
  pv.hidden = false;
  pv.innerHTML = `<strong>Preview.</strong> Nothing is saved or sent, and the assistant gives a canned reply.
    <span>See it as: ${["A", "B", "C"].map(g => `<a href="${previewUrl(g)}" class="${g === PG ? "on" : ""}">Group ${g}</a>`).join(" ")}</span>
    ${S.phase === "done" ? "" : `<button class="link" id="pv-skip">Skip to the next step →</button>`}
    <a href="${previewUrl(PG)}">Start over</a>`;
  const b = document.getElementById("pv-skip"); if (b) b.onclick = skip;
}

if (QS.has("reset")) { localStorage.removeItem(STORE); S = fresh(); history.replaceState(null, "", location.pathname + (PREVIEW ? "?preview=1&g=" + PG : MOCK ? "?mock=1" + (FAST ? "&fast=1" : "") : "")); }
if (S.phase === "learn" && remaining(S.learnStart, LEARN_MS()) === 0) endLearn(true);
render();
</script>
